# Palmimo Portal manifest. Spec: https://github.com/Jizai-inc/palmimo-devkit/blob/main/doc/reference/app-manifest.md

schema = 1

name = "palmimo-hackathon"
description = "A personal companion that recognizes its owner's face, remembers them, and chats only with them."

# Run "enroll" once (look at Palmimo while it moves its head), then "run".
command = [
  "python", "main.py",
  "--mode", "{mode}",
  "--name", "{owner_name}",
  "--chat-model", "{chat_model}",
  "--stt-model", "{stt_model}",
  "--face-threshold", "{face_threshold}",
  "--log-level", "{log_level}",
  "{log_text}",
]

devices = ["camera", "audio", "motor_display"]

[params.mode]
type = "enum"
choices = ["run", "enroll", "forget"]
default = "run"
description = "enroll: learn your face. run: companion mode. forget: erase your face, history and memories."

[params.owner_name]
type = "string"
default = "Jamie"
pattern = "^[A-Za-z][A-Za-z ' -]{0,39}$"
max_length = 40
description = "Your name, used during enroll and forget."

[params.chat_model]
type = "string"
default = "gpt-5-mini"
pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
description = "OpenAI model for conversation and memory."

[params.stt_model]
type = "string"
default = "gpt-4o-mini-transcribe"
pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
description = "OpenAI speech-to-text model."

[params.face_threshold]
type = "float"
default = 0.40
min = 0.30
max = 0.70
description = "How similar a face must be to count as you. Higher is stricter."

[params.log_level]
type = "enum"
choices = ["info", "debug"]
default = "info"
description = "debug adds every face match score, motion and token count. Log file: ~/.local/share/palmimo-hackathon/logs/"

[params.log_text]
type = "bool"
flag = "--log-text"
default = false
description = "Include what was said in the logs. Off by default because conversations are private."

[env.OPENAI_API_KEY]
required = true
description = "OpenAI API key for speech-to-text and conversation (only used after your face is recognized)."
help_url = "https://platform.openai.com/api-keys"
