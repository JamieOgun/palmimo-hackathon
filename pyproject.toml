[project]
name = "palmimo-hackathon"
version = "0.1.0"
description = "Palmimo personal companion: knows its owner, remembers them, chats only with them"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "openai>=3.60.0",
    "opencv-python>=5.1.0.95",
    "palmimo-sdk[face,hardware,speech,vision,voice]>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
